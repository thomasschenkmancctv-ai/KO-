name: Zombie Farm v0.15 packaged Windows gameplay QA
on:
  push:
    branches: [zombiefarm-windows-v012-build]
    paths: ['.github/workflows/zombiefarm-v015-qa.yml', 'zombiefarm-v015/windows_qa.py']
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ZombieFarm-v015-Windows
          run-id: 36396610965
          github-token: ${{ github.token }}
          path: build
      - name: Test-only graphics setup for hosted Windows VM
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          curl.exe --fail -L -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/25.1.6/mesa3d-25.1.6-release-msvc.7z
          if ((Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLower() -ne '7b4dea5f4fdd362acaffd13f4dd01de3b1e3f67a24c89ab92957eeb8a404e23d') { throw 'Mesa integrity failure' }
          7z x -omesa mesa.7z | Out-Null
      - name: Exact packaged game UI, saves and original invasion readiness
        shell: python
        run: |
          from pathlib import Path
          import runpy
          p=Path('zombiefarm-v015/windows_qa.py')
          s=p.read_text().replace('q.OUT=OUT','q.OUT=OUT\nq.u.IsIconic.argtypes=[q.W.HWND]\nq.u.ShowWindow.argtypes=[q.W.HWND,q.C.c_int]')
          p.write_text(s,encoding='utf-8')
          runpy.run_path(str(p),run_name='__main__')
      - name: Preserve exact test script
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import shutil
          Path('output').mkdir(exist_ok=True)
          shutil.copy2('zombiefarm-v015/windows_qa.py','output/windows_qa.py')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZombieFarm-v015-Windows-QA
          path: output/
          retention-days: 7
