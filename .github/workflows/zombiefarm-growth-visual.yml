name: Zombie Farm v0.14 Windows visible harvest verification
on:
  push:
    branches: [zombiefarm-windows-v012-build]
    paths: ['.github/workflows/zombiefarm-growth-visual.yml']
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ZombieFarm-v014-Windows-final-regression
          run-id: 36391503140
          github-token: ${{ github.token }}
          path: previous
      - name: Test-only graphics setup
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          curl.exe --fail -L -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/25.1.6/mesa3d-25.1.6-release-msvc.7z
          if ((Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLower() -ne '7b4dea5f4fdd362acaffd13f4dd01de3b1e3f67a24c89ab92957eeb8a404e23d') { throw 'Mesa integrity failure' }
          7z x -omesa mesa.7z | Out-Null
      - name: Drive original visible farm and manual harvest with frame-safe mouse events
        shell: python
        run: |
          from pathlib import Path
          import os,zipfile,subprocess,shutil,hashlib,base64,zlib,json,sys,time,traceback
          out=Path('output').resolve();out.mkdir(exist_ok=True)
          with zipfile.ZipFile('previous/desktop-source-and-content.zip')as z:z.extractall('desktop')
          exe=Path('previous/Zombie_Farm_Windows_v0.14.exe').resolve()
          assert hashlib.sha256(exe.read_bytes()).hexdigest()=='101984d684560f9b4b9a072785d115193fef3ca7cf82e27fb84fac44c18a859b'
          home=Path('visual-home').resolve();data=home/'UserData';data.mkdir(parents=True,exist_ok=True)
          os.environ.update(ZF_HOME=str(home),ZF_GROWTH_QA='1',ZF_QA_OUT=str(out),GALLIUM_DRIVER='llvmpipe',ALSOFT_DRIVERS='null')
          b=base64.b64decode(Path('zombiefarm-regression-fixtures/v013-completed-testfarm.b64').read_text().strip());assert hashlib.sha256(b).hexdigest()=='4701c40f2b333d38af3ab4c784c1c3f07462b5f5098e6e293e2bf760330a121e'
          for name,s in json.loads(zlib.decompress(b)).items():
              p=data/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(s))
          (data/'settings.json').write_text(json.dumps(dict(schema=1,sandbox=False,rate=1,free_shop=False,normalize=False,profile=0,tab_x=.86,tab_y=.28)))
          subprocess.run([str(exe),'--verify-package'],check=True,timeout=60)
          runtime=next((home/'versions').glob('0.14-*'))
          for p in Path('mesa/x64').glob('*.dll'):shutil.copy2(p,runtime/p.name)
          (data/'touchHLE_options.txt').write_text('com.playforge.ZombieFarm: --gles1=gles1_on_gl2\n')
          sys.path.insert(0,str(Path('desktop/tools').resolve()));import growth_regression as q
          def slow_mouse(x,y):
              q.u.SetForegroundWindow(q.geom()[0]);q.u.SetCursorPos(int(x),int(y));time.sleep(.3)
              q.u.mouse_event(2,0,0,0,0);time.sleep(.7);q.u.mouse_event(4,0,0,0,0);time.sleep(.5)
          q.mouse=slow_mouse
          proc=subprocess.Popen([str(exe)],env=os.environ.copy())
          try:
              time.sleep(18);q.game_click(.5,.55);time.sleep(8);q.shot('01-before-daily-reward.png')
              q.game_click(.895,.49);time.sleep(3);q.shot('02-reward-open.png')
              q.game_click(.34,.60);time.sleep(14);q.shot('03-reward-result.png')
              q.game_click(.79,.83);time.sleep(2);q.shot('04-farm-before-growth.png')
              q.toggle('sandbox',True);q.toggle('instant_zombies',True);q.wait(lambda s:not any(q.eligible(t)for t in s['tiles']));q.shot('05-sandbox-instant-growth.png');q.close();q.shot('06-farm-after-growth.png')
              q.command('save');before=q.state()['actors']
              q.game_click(.59,.65);time.sleep(5);q.command('save');s=q.state()
              q.shot('07-manual-zombie-harvest.png');q.check('visible_manual_harvest_adds_exactly_one_saved_actor',s['actors']==before+1,dict(before=before,after=s['actors']))
              (out/'final-state.json').write_text(json.dumps(s,indent=2))
          except Exception:
              (out/'visual-error.txt').write_text(traceback.format_exc());raise
          finally:
              q.u.PostMessageW(q.geom()[0],0x10,0,0);proc.wait(timeout=15)
              shutil.copytree(data/'logs',out/'logs',dirs_exist_ok=True)
              (out/'tested-exe.sha256').write_text(hashlib.sha256(exe.read_bytes()).hexdigest())
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZombieFarm-v014-Windows-visual-harvest
          path: output/
          retention-days: 7
