name: Zombie Farm v0.17 desktop controls
on:
  push:
    branches: [zombiefarm-windows-v012-build]
    paths: ['.github/workflows/zombiefarm-v017.yml','zombiefarm-v017/source.zip.b64','zombiefarm-v017/fix.py']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact preserved runtime
        shell: bash
        run: |
          git clone --no-checkout https://github.com/H1W0XXX/touchHLE.git engine
          cd engine
          git checkout fa3d09511d471f505e41abed7c535e4dfbd7c59c
          git submodule update --init --recursive
      - uses: actions/cache/restore@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: zf-v017-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            zf-v017-${{ runner.os }}-
            zf-sandbox-${{ runner.os }}-
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsndio-dev libboost-dev libasound2-dev libpulse-dev libudev-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxext-dev libxfixes-dev libxss-dev libxinerama-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install cmake==3.31.6
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install cmake==3.31.6
          curl --fail -L --retry 2 -o boost.7z https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z
          7z x -oengine/vendor boost.7z >/dev/null
          mv engine/vendor/boost_1_81_0 engine/vendor/boost
      - name: Restore source and apply desktop update
        shell: python
        run: |
          from pathlib import Path
          import zipfile,base64,io,lzma,hashlib,subprocess,runpy
          patch=Path('zombiefarm-v017')
          data=lzma.decompress(base64.b64decode(b''.join((patch/f'baseline.part{i}').read_bytes() for i in range(4))))
          assert hashlib.sha256(data).hexdigest()=='a5796794313a3b23f60829275ab3b6f9666be9b1830e874efc6396b90d94f1d9'
          Path('baseline.patch').write_bytes(data)
          subprocess.run(['git','-C','engine','apply','--check','../baseline.patch'],check=True)
          subprocess.run(['git','-C','engine','apply','../baseline.patch'],check=True)
          Path('baseline').mkdir()
          with zipfile.ZipFile('baseline/runtime-source.zip','w',zipfile.ZIP_DEFLATED)as z:
              for p in Path('engine/src').rglob('*'):
                  if p.is_file():z.write(p,p.relative_to('engine').as_posix())
          with zipfile.ZipFile(io.BytesIO(base64.b64decode((patch/'source.zip.b64').read_bytes())))as z:
              assert z.testzip() is None
              assert all('/'not in n and '\\'not in n for n in z.namelist())
              z.extractall(patch)
          p=patch/'texture_mods.rs';p.write_text(p.read_text().replace('let result=(||{','let result:Result<(),String>=(||{'))
          runpy.run_path(str(patch/'apply.py'),run_name='__main__')
          if (patch/'fix.py').exists():runpy.run_path(str(patch/'fix.py'),run_name='__main__')
      - name: Compile and test runtime
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/reports
          rustfmt --edition 2021 engine/src/desktop_game.rs engine/src/texture_mods.rs engine/src/desktop_mods.rs
          cd engine
          cargo build --release --locked --bin touchHLE 2>&1 | tee ../output/reports/build.log
          for suite in desktop_game::tests texture_mods::tests sandbox_rewards::tests zombie_growth::tests desktop_mods::tests farm_menu::tests software_gl::tests; do
            cargo test --release --locked --lib "$suite" 2>&1 | tee -a ../output/reports/unit-tests.log
          done
      - name: Preserve verified binaries and exact source
        shell: python
        run: |
          from pathlib import Path
          import zipfile,shutil,hashlib,json,os
          out=Path('output');name='touchHLE.exe'if os.name=='nt'else'touchHLE'
          shutil.copy2(Path('engine/target/release')/name,out/name)
          shutil.copytree('engine/touchHLE_dylibs',out/'touchHLE_dylibs',dirs_exist_ok=True)
          with zipfile.ZipFile(out/'runtime-source.zip','w',zipfile.ZIP_DEFLATED)as z:
              for folder in ['src','dev-scripts','dev-docs']:
                  for f in(Path('engine')/folder).rglob('*'):
                      if f.is_file():z.write(f,f.relative_to('engine').as_posix())
              for n in ['Cargo.toml','Cargo.lock','build.rs','.gitmodules','README.md','LICENSE']:z.write(Path('engine')/n,n)
          (out/'reports/identity.json').write_text(json.dumps({'version':'0.17','baseline':'exact v0.16 source recovered','runtime_sha256':hashlib.sha256((out/name).read_bytes()).hexdigest()},indent=2))
      - name: Preserve diagnostics
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import shutil
          Path('output/reports').mkdir(parents=True,exist_ok=True)
          for n in ['desktop_game.rs','texture_mods.rs','desktop_mods.rs']:
              p=Path('engine/src')/n
              if p.exists():shutil.copy2(p,Path('output/reports')/n)
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: zf-v017-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZombieFarm-v017-${{ runner.os }}
          path: output/
          retention-days: 90
