name: Zombie Farm v0.17 desktop controls
on:
  push:
    branches: [zombiefarm-windows-v012-build]
    paths: ['.github/workflows/zombiefarm-v017.yml','zombiefarm-v017/source.zip.b64']
permissions:
  contents: read
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ZombieFarm-v016-${{ runner.os }}
          run-id: 36472016952
          github-token: ${{ github.token }}
          path: baseline
      - name: Restore pinned runtime and inspectable patch source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/H1W0XXX/touchHLE.git engine
          cd engine
          git checkout fa3d09511d471f505e41abed7c535e4dfbd7c59c
          git submodule update --init --recursive
      - uses: actions/cache/restore@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: zf-usability-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            zf-usability-${{ runner.os }}-
            zf-sandbox-${{ runner.os }}-
            zf-menu-${{ runner.os }}-
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsndio-dev libboost-dev libasound2-dev libpulse-dev libudev-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxext-dev libxfixes-dev libxss-dev libxinerama-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev xvfb xauth xdotool python3-pil
          python3 -m pip install cmake==3.31.6 Pillow==11.3.0
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install cmake==3.31.6 Pillow==11.3.0
          curl --fail -L --retry 2 -o boost.7z https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z
          7z x -oengine/vendor boost.7z >/dev/null
          mv engine/vendor/boost_1_81_0 engine/vendor/boost
      - name: Apply targeted changes
        shell: python
        run: |
          from pathlib import Path
          import zipfile,base64,io
          patch=Path('zombiefarm-v017')
          with zipfile.ZipFile(io.BytesIO(base64.b64decode((patch/'source.zip.b64').read_bytes()))) as z:
              assert z.testzip() is None
              assert all('/' not in n and '\\' not in n for n in z.namelist())
              z.extractall(patch)
          p=patch/'texture_mods.rs';p.write_text(p.read_text().replace('let result=(||{','let result:Result<(),String>=(||{'))
          import runpy
          runpy.run_path(str(patch/'apply.py'),run_name='__main__')
      - name: Compile and test real runtime
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/reports
          rustfmt --edition 2021 engine/src/desktop_game.rs engine/src/texture_mods.rs engine/src/desktop_mods.rs
          cd engine
          cargo build --release --locked --bin touchHLE 2>&1 | tee ../output/reports/build.log
          for suite in desktop_game::tests texture_mods::tests sandbox_rewards::tests zombie_growth::tests desktop_mods::tests farm_menu::tests software_gl::tests; do
            cargo test --release --locked --lib "$suite" 2>&1 | tee -a ../output/reports/unit-tests.log
          done
      - name: Package original artwork and reproducible source
        shell: python
        run: |
          from pathlib import Path
          import zipfile,shutil,subprocess,hashlib,json,os,sys,runpy
          out=Path('output').resolve();root=Path('desktop').resolve()
          with zipfile.ZipFile('baseline/desktop-source-and-content.zip')as z:z.extractall(root)
          for name in ['launcher/main.go','tools/package.py']:
              p=root/name;p.write_text(p.read_text().replace('0.16','0.17'))
          runpy.run_path('zombiefarm-v017/assets.py',run_name='__main__')
          runtime=Path('runtime').resolve();shutil.copytree('baseline/runtime',runtime,dirs_exist_ok=True)
          exe='touchHLE.exe'if os.name=='nt'else'touchHLE'
          shutil.copy2(Path('engine/target/release')/exe,runtime/exe)
          subprocess.run([sys.executable,str(root/'tools/package.py'),'--runtime',str(runtime),'--platform','windows'if os.name=='nt'else'linux','--out',str(out)],check=True)
          platform='windows'if os.name=='nt'else'linux'
          old=json.loads(Path('baseline',platform+'-manifest.json').read_text());new=json.loads((out/(platform+'-manifest.json')).read_text())
          keys=[n for n in old['files']if n.startswith('Game/')];assert len(keys)==860
          assert all(new['files'][n]==old['files'][n]for n in keys)
          (out/'reports/preservation.json').write_text(json.dumps({'original_files_unchanged':len(keys),'baseline':'0.16','whisky_renderer_retained':True},indent=2))
          shutil.copy2(root/'content/mods/polish-audit.json',out/'reports/polish-audit.json')
          with zipfile.ZipFile(out/'desktop-source-and-content.zip','w',zipfile.ZIP_DEFLATED)as z:
              for folder in ['content','launcher','tools','tests']:
                  for f in(root/folder).rglob('*'):
                      if f.is_file()and f.name!='payload.zip'and '__pycache__'not in f.parts:
                          assert f.suffix.lower()not in('.ttf','.otf','.woff','.woff2');z.write(f,f.relative_to(root).as_posix())
          with zipfile.ZipFile(out/'runtime-source.zip','w',zipfile.ZIP_DEFLATED)as z:
              for folder in ['src','dev-scripts','dev-docs']:
                  for f in(Path('engine')/folder).rglob('*'):
                      if f.is_file():z.write(f,f.relative_to('engine').as_posix())
              for name in ['Cargo.toml','Cargo.lock','build.rs','.gitmodules','README.md','LICENSE']:z.write(Path('engine')/name,name)
          shutil.copytree(runtime,out/'runtime',dirs_exist_ok=True)
          shutil.copytree('zombiefarm-v017',out/'mod-source',dirs_exist_ok=True)
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: zf-usability-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZombieFarm-v017-${{ runner.os }}
          path: output/
          retention-days: 30
