name: Zombie Farm desktop build
on:
  push:
    branches: [zombiefarm-windows-v012-build]
    paths: ['.github/workflows/zombiefarm-desktop.yml', 'zombiefarm-desktop/**']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
      - name: Exact preserved runtime
        shell: bash
        run: |
          git clone --no-checkout https://github.com/H1W0XXX/touchHLE.git engine
          cd engine
          git checkout fa3d09511d471f505e41abed7c535e4dfbd7c59c
          git submodule update --init --recursive
      - name: Cached Windows dependencies
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: zf-desktop-Windows-fa3d095-v1
      - name: Cached Linux dependencies
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: zf-linux-build2
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsndio-dev libboost-dev libasound2-dev libpulse-dev libudev-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxext-dev libxfixes-dev libxss-dev libxinerama-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install cmake==3.31.6
      - name: Windows prerequisites
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl --fail -L --retry 2 -o boost.7z https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z
          7z x -oengine/vendor boost.7z >/dev/null
          mv engine/vendor/boost_1_81_0 engine/vendor/boost
          python -m pip install cmake==3.31.6
      - name: Apply explicit desktop integration
        shell: bash
        run: |
          python zombiefarm-desktop/tools/patch_runtime.py engine
          rustfmt --edition 2021 engine/src/desktop_mods.rs
      - name: Compile and test real runtime
        shell: bash
        run: |
          mkdir -p output/reports
          cd engine
          cargo build --release --locked --bin touchHLE 2>&1 | tee ../output/reports/build.log
          cargo test --release --locked --lib desktop_mods::tests 2>&1 | tee ../output/reports/runtime-tests.log
      - name: Stage reproducible runtime
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, shutil, os, json, zipfile, hashlib
          root=pathlib.Path('engine');out=pathlib.Path('output')
          name='touchHLE.exe' if os.name=='nt' else 'touchHLE'
          shutil.copy2(root/'target/release'/name,out/name)
          for name in ('touchHLE_dylibs','touchHLE_fonts'):
              shutil.copytree(root/name,out/name,dirs_exist_ok=True)
          for name in ('touchHLE_default_options.txt','LICENSE'):
              shutil.copy2(root/name,out/name)
          with zipfile.ZipFile(out/'runtime-source.zip','w',zipfile.ZIP_DEFLATED)as z:
              for base in ('src','dev-docs','dev-scripts'):
                  for p in(root/base).rglob('*'):
                      if p.is_file():z.write(p,str(p.relative_to(root)))
              for name in ('Cargo.toml','Cargo.lock','build.rs','.gitmodules','README.md','LICENSE'):
                  p=root/name
                  if p.is_file():z.write(p,name)
          (out/'reports/build.json').write_text(json.dumps({'version':'0.12','runtime_commit':'fa3d09511d471f505e41abed7c535e4dfbd7c59c','desktop_mod_sha256':hashlib.sha256((root/'src/desktop_mods.rs').read_bytes()).hexdigest(),'platform':os.name},indent=2))
          PY
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          mkdir -p output/lib
          cp -L /usr/lib/x86_64-linux-gnu/libsndio.so.* output/lib/ || true
          ldd output/touchHLE >output/reports/dependencies.txt
      - name: Preserve diagnostics and source on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p output/reports
          cp engine/src/desktop_mods.rs output/reports/ || true
          (cd engine && git diff) >output/reports/integration.diff || true
      - name: Save incremental build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: zf-desktop-${{ runner.os }}-v012-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZombieFarm-v012-${{ runner.os }}
          path: output/
          retention-days: 3
