name: Zombie Farm v0.14 completed-farm Windows regression
on:
  push:
    branches: [zombiefarm-windows-v012-build]
    paths: ['.github/workflows/zombiefarm-growth-retest.yml']
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ZombieFarm-v014-Windows-tested
          run-id: 36390596467
          github-token: ${{ github.token }}
          path: output
      - name: Retain exact EXE and use pre-existing completed developer test farm
        shell: python
        run: |
          from pathlib import Path
          import zipfile,hashlib,shutil
          out=Path('output')
          assert hashlib.sha256((out/'Zombie_Farm_Windows_v0.14.exe').read_bytes()).hexdigest()=='101984d684560f9b4b9a072785d115193fef3ca7cf82e27fb84fac44c18a859b'
          (out/'growth-error.txt').unlink(missing_ok=True)
          shutil.rmtree(out/'growth-evidence',ignore_errors=True)
          with zipfile.ZipFile(out/'desktop-source-and-content.zip')as z:z.extractall('desktop')
          p=Path('desktop/tools/windows_growth_entry.py');s=p.read_text()
          fixture="""
          fixture_bytes=base64.b64decode(Path('zombiefarm-regression-fixtures/v013-completed-testfarm.b64').read_text().strip())
          assert hashlib.sha256(fixture_bytes).hexdigest()=='4701c40f2b333d38af3ab4c784c1c3f07462b5f5098e6e293e2bf760330a121e'
          for name,encoded in json.loads(zlib.decompress(fixture_bytes)).items():
              assert name.startswith('touchHLE_sandbox/com.playforge.ZombieFarm/') and '..' not in Path(name).parts
              target=DATA/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(base64.b64decode(encoded))
          """
          s=s.replace('proc=None','proc=None\n'+fixture)
          s=s.replace("start(fresh=True);q.shot('00-native-windows-farm.png');roots=q.suite()", "start();q.game_click(.895,.49);time.sleep(2);q.game_click(.34,.60);time.sleep(14);q.game_click(.79,.83);time.sleep(1);q.shot('00-native-windows-farm.png');roots=q.suite()")
          p.write_text(s,encoding='utf-8',newline='\n')
          p=Path('desktop/tools/growth_regression.py');s=p.read_text();old="check('no_duplicate_actors_after_batches',s['actors']==s0['actors'],s['actors'])";assert s.count(old)==1
          s=s.replace(old,"command('save');s=state();"+old)
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Test-only graphics setup
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          curl.exe --fail -L -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/25.1.6/mesa3d-25.1.6-release-msvc.7z
          if ((Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLower() -ne '7b4dea5f4fdd362acaffd13f4dd01de3b1e3f67a24c89ab92957eeb8a404e23d') { throw 'Mesa integrity failure' }
          7z x -omesa mesa.7z | Out-Null
      - name: Execute the original game, UI toggle, 108 stage cases, and actual save reloads
        shell: pwsh
        run: |
          python desktop/tools/windows_growth_entry.py 2>&1 | Tee-Object output/growth-qa.log
          if ($LASTEXITCODE -ne 0) { throw 'completed-farm growth regression failed' }
      - name: Preserve exact test source and verified release
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import zipfile,shutil,json,hashlib
          out=Path('output')
          for n in ['growth_regression.py','windows_growth_entry.py']:
              shutil.copy2(Path('desktop/tools')/n,out/n)
          with zipfile.ZipFile(out/'desktop-source-and-content.zip','w',zipfile.ZIP_DEFLATED)as z:
              for p in Path('desktop').rglob('*'):
                  if p.is_file() and '__pycache__' not in p.parts and p.name!='payload.zip':
                      assert p.suffix.lower() not in ['.ttf','.otf','.woff','.woff2'];z.write(p,p.relative_to('desktop').as_posix())
          (out/'test-environment.txt').write_text('Exact v0.14 EXE; native Windows Server 2022 with test-only Mesa llvmpipe.\nWorking v0.13 launcher retained and its native GUI recovery/fullscreen tests passed in run 36390596467.\nLive growth regression uses isolated developer-created post-tutorial v0.13 save: 36 zombie types x 3 stages, actual production toggle and original save serializer.\nOriginal first fresh-game test hit unfinished-tutorial map reset; this test starts from a completed farm, as does the user.\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZombieFarm-v014-Windows-final-regression
          path: output/
          retention-days: 7
