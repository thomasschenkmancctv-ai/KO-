name: Zombie Farm v0.15 saves and invasions
on:
  push:
    branches: [zombiefarm-windows-v012-build]
    paths: ['.github/workflows/zombiefarm-menu.yml', 'zombiefarm-menu/**']
permissions:
  contents: read
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      CARGO_TERM_COLOR: never
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ZombieFarm-v014-${{ runner.os }}
          run-id: 36389600296
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: ZombieFarm-v014-Windows-final-regression
          run-id: 36391503140
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/download-artifact@v4
        with:
          name: ZombieFarm-Windows-app-local-dependencies
          run-id: 36309054353
          github-token: ${{ github.token }}
          path: crt
      - name: Preserved source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/H1W0XXX/touchHLE.git engine
          cd engine
          git checkout fa3d09511d471f505e41abed7c535e4dfbd7c59c
          git submodule update --init --recursive
      - uses: actions/cache/restore@v4
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: zf-menu-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            zf-menu-${{ runner.os }}-
            zf-growth-${{ runner.os }}-
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsndio-dev libboost-dev libasound2-dev libpulse-dev libudev-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxext-dev libxfixes-dev libxss-dev libxinerama-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install cmake==3.31.6
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl --fail -L -o boost.7z https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z
          7z x -oengine/vendor boost.7z >/dev/null
          mv engine/vendor/boost_1_81_0 engine/vendor/boost
          python -m pip install cmake==3.31.6
      - name: Apply source and compile
        shell: bash
        run: |
          mkdir -p output/reports
          python zombiefarm-menu/apply.py
          cp zombiefarm-menu/saves_test.go desktop/launcher/
          rustfmt --edition 2021 engine/src/farm_menu.rs engine/src/desktop_mods.rs engine/src/zombie_growth.rs
          gofmt -w desktop/launcher/main.go desktop/launcher/saves.go desktop/launcher/saves_test.go
          cd engine
          cargo build --release --locked --bin touchHLE 2>&1 | tee ../output/reports/build.log
          cargo test --release --locked --lib farm_menu::tests 2>&1 | tee ../output/reports/menu-tests.log
          cargo test --release --locked --lib zombie_growth::tests 2>&1 | tee ../output/reports/growth-tests.log
          cargo test --release --locked --lib desktop_mods::tests 2>&1 | tee ../output/reports/desktop-tests.log
      - name: Stage and package
        shell: python
        run: |
          from pathlib import Path
          import os,zipfile,shutil,subprocess,sys,hashlib,json
          root=Path('engine');out=Path('output');rt=out/'runtime';rt.mkdir(exist_ok=True)
          exe='touchHLE.exe' if os.name=='nt' else 'touchHLE'
          shutil.copy2(root/'target/release'/exe,rt/exe)
          for n in ['LICENSE','touchHLE_default_options.txt']:shutil.copy2(root/n,rt/n)
          shutil.copytree(root/'touchHLE_dylibs',rt/'touchHLE_dylibs',dirs_exist_ok=True)
          if os.name=='nt':
              for f in Path('crt').glob('*.dll'):shutil.copy2(f,rt/f.name)
          elif Path('baseline/lib').exists():shutil.copytree('baseline/lib',rt/'lib',dirs_exist_ok=True)
          subprocess.run([sys.executable,'desktop/tools/package.py','--runtime',str(rt.resolve()),'--platform','windows' if os.name=='nt' else 'linux','--out',str(out.resolve())],check=True)
          with zipfile.ZipFile(out/'runtime-source.zip','w',zipfile.ZIP_DEFLATED)as z:
              for p in (root/'src').rglob('*'):
                  if p.is_file():z.write(p,p.relative_to(root).as_posix())
              for n in ['Cargo.toml','Cargo.lock','build.rs','.gitmodules','README.md','LICENSE']:z.write(root/n,n)
          with zipfile.ZipFile(out/'desktop-source-and-content.zip','w',zipfile.ZIP_DEFLATED)as z:
              for p in Path('desktop').rglob('*'):
                  if p.is_file() and p.name!='payload.zip' and '__pycache__' not in p.parts:
                      assert p.suffix.lower() not in ('.ttf','.otf','.woff','.woff2')
                      z.write(p,p.relative_to('desktop').as_posix())
          (out/'reports/identity.json').write_text(json.dumps({'version':'0.15','runtime_sha256':hashlib.sha256((rt/exe).read_bytes()).hexdigest(),'menu_sha256':hashlib.sha256((root/'src/farm_menu.rs').read_bytes()).hexdigest()},indent=2))
      - name: Retain diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p output/reports
          cp engine/src/farm_menu.rs output/reports/ || true
          cp engine/src/desktop_mods.rs output/reports/ || true
          cp zombiefarm-menu/apply.py output/reports/ || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            engine/target
            ~/.cargo/registry
            ~/.cargo/git
          key: zf-menu-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZombieFarm-v015-${{ runner.os }}
          path: output/
          retention-days: 14
