name: Zombie Farm Windows dependencies
on:
  push:
    branches: [zombiefarm-windows-v012-build]
    paths: ['.github/workflows/zombiefarm-windows-dependencies.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Collect app-local Visual C++ runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dll = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -Filter msvcp140.dll | Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch 'debug' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dll) { throw 'Microsoft x64 redistributable not found' }
          Copy-Item "$($dll.DirectoryName)\*.dll" output
          Get-FileHash output\*.dll -Algorithm SHA256 | Format-List | Out-File output\dependency-sha256.txt
          Get-ChildItem output
      - uses: actions/upload-artifact@v4
        with:
          name: ZombieFarm-Windows-app-local-dependencies
          path: output/
          retention-days: 3
